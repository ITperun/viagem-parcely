<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viagem – parcely</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #notice {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #fff; padding: 8px 14px; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3); font: 14px sans-serif;
      z-index: 1000; display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="notice"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Ниже этого масштаба парцелы не запрашиваются
    const MIN_PARCEL_ZOOM = 14;

    const NAMES = {
      '659541': 'Jičín',
      '681679': 'Libáň',
      '705128': 'Nová Paka',
      '752096': 'Sobotka'
    };
    const COLORS = {
      '659541': '#e74c3c',
      '681679': '#27ae60',
      '705128': '#2980b9',
      '752096': '#8e44ad'
    };

    const map = L.map('map', { preferCanvas: true }).setView([50.467, 15.172], 11);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const renderer = L.canvas({ padding: 0.5 });
    const notice = document.getElementById('notice');

    // Слой парцел
    const parcelLayer = L.geoJSON(null, {
      renderer,
      style: { color: '#d33', weight: 1, fillOpacity: 0.2 },
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        layer.bindPopup(
          `Parcela ${p.label || '—'}<br>` +
          `Výměra: ${p.areaValue ?? '—'} m²<br>` +
          `KÚ: ${p.nationalCadastralReference || '—'}`
        );
      }
    }).addTo(map);

    // Слой территорий: рамки с названиями видны при отдалении
    const territoryLayer = L.layerGroup();

    fetch('api/territories.php')
      .then(r => r.json())
      .then(rows => {
        rows.forEach(t => {
          const name = NAMES[t.ku] || t.ku;
          const rect = L.rectangle(
            [[t.min_lat, t.min_lng], [t.max_lat, t.max_lng]],
            { color: COLORS[t.ku] || '#333', weight: 2, fillOpacity: 0.1 }
          );
          rect.bindTooltip(`${name}: ${t.parcels} parcel`, { permanent: true, direction: 'center' });
          rect.on('click', () => map.fitBounds(rect.getBounds()));
          territoryLayer.addLayer(rect);
        });
        updateByZoom();
      })
      .catch(err => console.error(err));

    let controller = null;
    let timer = null;

    function loadParcels() {
      if (map.getZoom() < MIN_PARCEL_ZOOM) {
        parcelLayer.clearLayers();
        return;
      }

      if (controller) controller.abort();
      controller = new AbortController();

      const b = map.getBounds();
      const params = new URLSearchParams({
        minLng: b.getWest(),
        minLat: b.getSouth(),
        maxLng: b.getEast(),
        maxLat: b.getNorth()
      });

      fetch(`api/parcels.php?${params}`, { signal: controller.signal })
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then(data => {
          parcelLayer.clearLayers();
          if (data.truncated) {
            notice.textContent = 'Příliš mnoho parcel. Přibližte mapu.';
            notice.style.display = 'block';
          } else {
            notice.style.display = 'none';
            parcelLayer.addData(data);
          }
        })
        .catch(err => {
          if (err.name !== 'AbortError') console.error(err);
        });
    }

    // Переключение между территориями и парцелами по масштабу
    function updateByZoom() {
      if (map.getZoom() < MIN_PARCEL_ZOOM) {
        if (!map.hasLayer(territoryLayer)) territoryLayer.addTo(map);
        notice.textContent = 'Přibližte mapu, abyste viděli parcely.';
        notice.style.display = 'block';
      } else {
        if (map.hasLayer(territoryLayer)) map.removeLayer(territoryLayer);
        notice.style.display = 'none';
      }
    }

    function onMove() {
      updateByZoom();
      clearTimeout(timer);
      timer = setTimeout(loadParcels, 300);
    }

    map.on('moveend', onMove);
    loadParcels();
  </script>
</body>
</html>
